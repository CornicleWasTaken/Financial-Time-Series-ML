# Docker Compose skeleton.
#
# Phase 0 only wires up the app image so `docker compose up` works end-to-end
# for the skeleton. The postgres and mlflow services are stubbed for the
# phases that need them (12 and 6 respectively) and are commented out until
# those phases land.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-ml:dev
    container_name: financial-ml-app
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      # DATABASE_URL is wired in once Phase 12 lands; left as a placeholder
      # so the service is ready to consume it.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/financial_ml
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount generated artifacts so they survive container restarts.
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./configs:/app/configs:ro
    depends_on: []
    # healthcheck is added in Phase 11 once /healthz exists.

